<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101b17" />
    <title>Змейка — маленькая аркада</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="game-card" aria-label="Игра Змейка">
        <div class="card-head">
          <span class="live"><i class="dot"></i> Игровое поле</span>
          <span>20 × 20</span>
        </div>
        <div class="stats" aria-label="Результаты">
          <div class="stat">
            <small>Счёт</small><strong id="score">00</strong>
          </div>
          <div class="stat">
            <small>Рекорд</small><strong id="best">00</strong>
          </div>
          <div class="stats-note">Ешь. Расти.<br /><span>Повтори.</span></div>
        </div>
        <div class="board-wrap">
          <canvas
            id="board"
            width="600"
            height="600"
            aria-label="Игровое поле змейки. Нажмите относительно головы, чтобы повернуть."
          ></canvas>
          <div class="overlay" id="overlay">
            <div>
              <strong id="message">Готов играть?</strong
              ><span id="submessage">Коснись экрана, чтобы начать</span>
            </div>
          </div>
        </div>
        <div class="card-foot">
          <span>Собирай яблоки, чтобы расти</span><span>✳ Удачи!</span>
        </div>
        <div class="actions">
          <button class="secondary" id="pause">Пауза</button>
        </div>
        <p class="hint">
          Коснись поля в направлении движения<br /><span
            >Стрелки или WASD — старт и движение · Пробел — старт и пауза</span
          >
        </p>
      </section>
      <footer>
        <span>МАЛЕНЬКАЯ ПЕРЕДЫШКА</span><span>ИГРАЙ В СВОЁМ ТЕМПЕ ✳</span>
      </footer>
    </main>
  </body>
</html>
